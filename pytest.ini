[pytest]
# Only collect tests from the primary test package
testpaths = tests
python_files = test_*.py

# Ensure the project root is on PYTHONPATH so top‑level packages like ``steps``
# can be imported from test modules located in ``tests``.
pythonpath = .

# Exclude directories that contain stale conftest files or external dependencies
norecursedirs = runs data pwrepo

# Prevent pytest from loading external plugins that may cause conflicts
addopts = -p no:warnings

# Report generation options (auto-update on test completion)
# Directory where test results will be stored
report_results_root = test-results

# Video recording: retain-on-failure, off, on
report_video = retain-on-failure

# Screenshots: only-on-failure, off, on
report_screenshot = only-on-failure

# Trace recording: on-first-retry, off, on
report_trace = on-first-retry